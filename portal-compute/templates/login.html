<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArenaLake — Login</title>

    <!-- Tipografia Canônica: Inter e JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="icon" type="image/png" href="/static/img/logo-simbolo-recorte.png">
</head>

<body>
    <!-- Background: Ondas do Lago de Partículas (ArenaLake) -->
    <canvas id="lake-canvas" class="lake-canvas" aria-hidden="true"></canvas>

    <main class="login-container">
        <div class="login-card">
            <!-- Cabeçalho com Logotipo Oficial -->
            <div class="card-header">
                <a href="/" class="brand-link" aria-label="ArenaLake">
                    <img src="/static/img/logo-reverse-proposta.png" 
                         alt="ArenaLake" 
                         class="brand-logo" 
                         width="190" 
                         height="67">
                </a>
                <h1 class="card-title">Portal Compute</h1>
                <p class="card-subtitle">Entre com suas credenciais para acessar o workspace</p>
            </div>

            <!-- Alerta Discreto de Validação / Erro -->
            <div id="login-alert" class="login-alert" role="alert" aria-live="polite" hidden>
                <span id="alert-message">Credenciais inválidas. Verifique seu usuário e senha.</span>
            </div>

            <!-- Formulário Principal -->
            <form id="login-form" method="POST" action="/login" novalidate>
                <div class="form-field">
                    <label for="usuario" class="field-label">Login</label>
                    <input type="text" 
                           id="usuario" 
                           name="usuario" 
                           class="field-input" 
                           placeholder="Digite seu login" 
                           required 
                           autocomplete="username" 
                           autofocus 
                           spellcheck="false">
                </div>

                <div class="form-field">
                    <div class="field-label-row">
                        <label for="senha" class="field-label">Senha</label>
                    </div>
                    <div class="input-password-wrapper">
                        <input type="password" 
                               id="senha" 
                               name="senha" 
                               class="field-input" 
                               placeholder="Sua senha" 
                               required 
                               autocomplete="current-password">
                        <button type="button" 
                                id="toggle-password" 
                                class="toggle-password-btn" 
                                aria-label="Mostrar ou ocultar senha"
                                tabindex="-1">
                            <svg class="eye-icon eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-label" for="remember">
                        <input type="checkbox" id="remember" name="remember" class="checkbox-input">
                        <span class="checkbox-custom" aria-hidden="true">
                            <svg viewBox="0 0 12 10" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 5l3.5 3.5L11 1"/>
                            </svg>
                        </span>
                        <span class="remember-text">Lembrar neste dispositivo</span>
                    </label>
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">
                    <span class="btn-spinner" aria-hidden="true"></span>
                    <span class="btn-text">Entrar</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Three.js (WebGL) e Mar de Dados Oficial ArenaLake -->
    <script src="/static/js/three.min.js"></script>
    <script src="/static/js/mar-de-dados.js"></script>
    <script src="/static/js/login.js"></script>
</body>

</html>
