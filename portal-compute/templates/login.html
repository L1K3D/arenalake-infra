<!DOCTYPE html>
<html>

<head>
    <title>ArenaLake - Login</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body>
    <div class="card">
        <h2>🚀 ArenaLake</h2>
        <p style="color: #8b949e; font-size: 0.9em; margin-bottom: 25px;">Plataforma Acadêmica de Big Data</p>

        <!-- Formulário interceptado pelo JavaScript -->
        <form id="login-form">
            <!-- Adicionado id="usuario" -->
            <input type="text" id="usuario" name="usuario" placeholder="Nome de usuário (ex: heitor)" required>

            <!-- Adicionado id="senha" -->
            <input type="password" id="senha" name="senha" placeholder="Senha" required>

            <button type="submit">Entrar no Workspace</button>
        </form>
    </div>

    <!-- Importa o script que acabamos de criar -->
    <script src="/static/js/login.js"></script>
</body>

</html>
