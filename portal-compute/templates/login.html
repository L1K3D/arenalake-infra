<!DOCTYPE html>
<html>

<head>
    <title>ArenaLake - Login</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body>
    <div class="card">
        <h2>🚀 ArenaLake</h2>
        <p style="color: #8b949e; font-size: 0.9em; margin-bottom: 25px;">Academic Big Data Platform</p>

        <form id="login-form">
            <input type="text" id="usuario" name="usuario" placeholder="Username (e.g. heitor)" required>
            <input type="password" id="senha" name="senha" placeholder="Password" required>

            <button type="submit">Enter Workspace</button>
        </form>
    </div>

    <script src="/static/js/login.js"></script>
</body>

</html>
