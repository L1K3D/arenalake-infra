<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArenaLake — Configuração de Segurança</title>

    <!-- Tipografia Canônica: Inter e JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="icon" type="image/png" href="/static/img/logo-simbolo-recorte.png">

    <style>
        .qr-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 12px 0 16px;
        }

        .qr-box {
            background: #ffffff;
            padding: 12px;
            border-radius: var(--r-md);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        #qr-code-img {
            width: 170px;
            height: 170px;
            display: block;
            border-radius: 4px;
        }

        .qr-hint {
            font-size: 0.8rem;
            color: var(--arena-text-dim);
            text-align: center;
            margin: 0;
        }
    </style>
</head>

<body>
    <!-- Background: Ondas do Lago de Partículas (ArenaLake) -->
    <canvas id="lake-canvas" class="lake-canvas" aria-hidden="true"></canvas>

    <main class="login-container">
        <div class="login-card" style="max-width: 440px;">
            <!-- Cabeçalho com Logotipo Oficial -->
            <div class="card-header">
                <a href="/" class="brand-link" aria-label="ArenaLake">
                    <img src="/static/img/logo-reverse-proposta.png" 
                         alt="ArenaLake" 
                         class="brand-logo" 
                         width="190" 
                         height="67">
                </a>
                <h1 class="card-title">Configuração de Segurança</h1>
                <p class="card-subtitle">Primeiro acesso detectado. Escaneie o QR Code no seu aplicativo autenticador e defina sua nova senha.</p>
            </div>

            <!-- Alerta Discreto de Validação / Erro -->
            <div id="first-access-alert" class="login-alert" role="alert" aria-live="polite" hidden>
                <span id="alert-message">Erro na validação dos dados.</span>
            </div>

            <!-- QR Code do 2FA -->
            <div class="qr-wrapper">
                <div class="qr-box">
                    <img id="qr-code-img" src="" alt="Carregando QR Code 2FA...">
                </div>
                <p class="qr-hint">Escaneie com Google Authenticator ou Microsoft Authenticator</p>
            </div>

            <!-- Formulário de Primeiro Acesso -->
            <form id="first-access-form" novalidate autocomplete="off">
                <div class="form-field">
                    <label for="new_password" class="field-label">Nova Senha de Acesso</label>
                    <div class="input-password-wrapper">
                        <input type="password" 
                               id="new_password" 
                               name="new_password" 
                               class="field-input" 
                               placeholder="Mínimo de 8 caracteres" 
                               required 
                               minlength="8" 
                               autocomplete="new-password">
                        <button type="button" 
                                id="toggle-password" 
                                class="toggle-password-btn" 
                                aria-label="Mostrar ou ocultar senha"
                                tabindex="-1">
                            <svg class="eye-icon eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-field" style="margin-top: 6px;">
                    <label for="otp_code" class="field-label">Código Gerado no App (6 dígitos)</label>
                    <input type="text" 
                           id="otp_code" 
                           name="otp_code" 
                           class="field-input" 
                           style="font-family: var(--font-mono); font-size: 1.15rem; letter-spacing: 0.2em; text-align: center; color: var(--arena-blue);"
                           placeholder="000000" 
                           maxlength="6" 
                           inputmode="numeric" 
                           pattern="[0-9]*" 
                           required>
                </div>

                <button type="submit" id="submit-btn" class="btn-submit" style="margin-top: 10px;">
                    <span class="btn-spinner" aria-hidden="true"></span>
                    <span class="btn-text">Validar e Concluir Cadastro</span>
                </button>

                <div class="otp-footer-links" style="margin-top: 18px;">
                    <a href="/" class="otp-back-link" id="cancel-link">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Voltar ao início de sessão
                    </a>
                </div>
            </form>
        </div>
    </main>

    <!-- Three.js (WebGL) e Mar de Dados Oficial ArenaLake -->
    <script src="/static/js/three.min.js"></script>
    <script src="/static/js/mar-de-dados.js"></script>
    <script src="/static/js/first-access.js"></script>
</body>

</html>
