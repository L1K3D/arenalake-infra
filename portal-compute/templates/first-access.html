<!DOCTYPE html>
<html>

<head>
    <title>ArenaLake - 2FA Security Setup</title>
    <link rel="stylesheet" href="/static/css/login.css">
    <style>
        .qr-container {
            background: white;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
            margin: 15px 0;
        }

        #qr-code-img {
            width: 200px;
            height: 200px;
        }
    </style>
</head>

<body>
    <div class="card" style="width: 400px;">
        <h2>🔐 Security Setup</h2>
        <p style="color: #8b949e; font-size: 0.9em; margin-bottom: 15px;">
            This is your first sign-in. You must change your password and configure Google/Microsoft Authenticator.
        </p>

        <div class="qr-container">
            <img id="qr-code-img" src="" alt="Loading QR Code...">
        </div>
        <p style="color: #8b949e; font-size: 0.8em; margin-top: 0;">Scan it with your authenticator app</p>

        <form id="first-access-form">
            <input type="password" id="new_password" placeholder="Enter a strong new password" required minlength="8">
            <input type="text" id="otp_code" placeholder="6-digit app code (OTP)" required maxlength="6"
                pattern="\d{6}">

            <button type="submit">Validate and Enter</button>
        </form>
    </div>

    <script src="/static/js/first-access.js"></script>
</body>

</html>
