name: Build and Publish Workspace Image

# Publishes the reusable ArenaLake workspace image to GitHub Container Registry
# whenever the workspace Dockerfile changes or the workflow is triggered manually.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docker/Dockerfile.workspace'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Pulls the repo code so the Dockerfile and build context are available.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Authenticates the workflow against GHCR so the image can be pushed.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Normalizes the repository owner/name to lowercase so GHCR image tags are valid.
      - name: Lowercase Repository Owner Name
        id: string_case
        run: |
          LOWERCASE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "lowercase=$LOWERCASE_REPO" >> $GITHUB_OUTPUT

      # Builds the workspace image from the Dockerfile and pushes it to GHCR as the latest tag.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.workspace
          push: true
          tags: |
            ghcr.io/${{ steps.string_case.outputs.lowercase }}/arenalake-workspace:latest