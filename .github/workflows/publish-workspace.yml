name: Build and Publish Workspace Image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docker/Dockerfile.workspace'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner Name
        id: string_case
        uses: inner-bottle/string-case-action@v1
        with:
          string: ${{ github.repository }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.workspace
          push: true
          tags: |
            ghcr.io/${{ steps.string_case.outputs.lowercase }}/arenalake-workspace:latest