services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: arenalake_dev
      POSTGRES_USER: arenalake_dev
      POSTGRES_PASSWORD: local_only_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenalake_dev -d arenalake_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arenalake_dev
      MINIO_ROOT_PASSWORD: local_only_minio_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-dev-data:/data

  portal:
    build:
      context: ../../apps/portal
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://arenalake_dev:local_only_password@postgres:5432/arenalake_dev
      DBA_USERNAME: arenalake_dev_admin
      DBA_PASSWORD: local_only_admin_password
      JWT_SECRET_KEY: local_only_jwt_signing_secret_do_not_reuse
      MINIO_ACCESS_KEY: arenalake_dev
      MINIO_SECRET_KEY: local_only_minio_password
      MINIO_ENDPOINT: http://minio:9000
      WORKSPACE_NETWORK: arenalake-dev
      WORKSPACE_IMAGE: arenalake-workspace:dev
    command:
      - /bin/sh
      - -c
      - python -m core.init_db && uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-dev-data:
  minio-dev-data:
