services:
  telemetry-agent:
    image: ghcr.io/l1k3d/arenalake-infra/telemetry:latest
    container_name: deploy-telemetry-agent-1
    restart: always
    environment:
      - DOCKER_HOST=tcp://dockerproxy:2375
    networks:
      - arenalake-net
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  arenalake-net:
    external: true