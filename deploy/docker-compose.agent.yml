services:
  telemetry-agent:
    build:
      context: ../../apps/telemetry-agent
      dockerfile: Dockerfile
    image: ${TELEMETRY_IMAGE:-arenalake-telemetry:latest}
    privileged: true
    volumes:
      - /sys:/sys:ro
      - /proc:/proc:ro
    networks:
      - arenalake-prod_arenalake-net # Conecta diretamente na rede overlay criada pelo Swarm
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/metrics', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  arenalake-prod_arenalake-net:
    external: true