# -----------------------------------------------------------------------------
# ArenaLake MVP Configuration - Core Infrastructure
# This file orchestrates the foundational services required for the Data Lake,
# routing, distributed processing, and the automated workspace provisioning.
# -----------------------------------------------------------------------------
services:

  # 1. GATEWAY / ROUTER (Traefik)
  # Acts as a reverse proxy, dynamically routing traffic to the user workspaces
  # and exposing internal services securely without opening multiple ports.
  traefik:
    image: traefik:v2.11
    environment:
      - DOCKER_API_VERSION=1.41
    command:
      - "--api.insecure=true"                   # Enables the Traefik web UI dashboard
      - "--api.dashboard=true"
      - "--providers.docker=true"               # Listens to Docker events to route dynamically
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false" # Only routes containers with explicit labels
      - "--entrypoints.web.address=:80"         # Main entrypoint for HTTP traffic
    ports:
      - "80:80"                                 # Standard HTTP port
      - "8088:8080"                             # Traefik Dashboard port
    volumes:
      # Required for Traefik to read container states and labels
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - arenalake-net

  # 2. PROCESSING BRAIN (Spark Master)
  # The central orchestrator for the Apache Spark cluster. It manages the 
  # dedicated worker nodes that are spun up dynamically per user.
  spark-master:
    image: bitnamilegacy/spark:3.5
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"                             # Spark Master Web UI (Job monitoring)
      - "7077:7077"
    volumes:
      - ./jobs:/jobs                             # Spark internal RPC port for Workers
    networks:
      - arenalake-net

  # 3. DATA LAKE (MinIO)
  # S3-compatible object storage serving as the core Data Lake repository 
  # for raw (Bronze), refined (Silver), and aggregated (Gold) datasets.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Dynamic credentials injected from the host's .env file for security
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"                             # S3 API Port (used by Spark and FastAPI)
      - "9001:9001"                             # MinIO Web Console Port
    volumes:
      # Mounts the persistent volume to ensure data survives container restarts
      - minio_data:/data
    networks:
      - arenalake-net

  # 4. WORKSPACE BASE IMAGE BUILDER
  # Ensures the "plug-and-play" capability by automatically building the custom 
  # VS Code/Jupyter Docker image on the host before users attempt to log in.
  workspace-builder:
    build:
      context: .
      dockerfile: docker/Dockerfile.workspace
    image: arenalake-workspace:latest
    # Exits immediately after the build is completed successfully
    command: echo "Imagem arenalake-workspace construída com sucesso!"

  # 5. OPERATION ORCHESTRATOR (FastAPI Backend Portal)
  # The core brain of the platform. Serves the UI, handles user authentication,
  # queries MinIO, and spawns dynamic Docker containers for user workspaces.
  portal:
    build: 
      context: ./portal-compute
      dockerfile: Dockerfile
    env_file:
       - .env                                   # Injects MinIO credentials and secrets
    environment:
      # Injects the host's absolute path to map user directories dynamically
      - HOST_PROJECT_PATH=${PWD}
    ports:
      - "8000:8000"                             # Portal Web UI Port
    volumes:
      # Docker-out-of-Docker (DooD): Allows the Portal container to spawn 
      # sibling containers (VS Code/Spark Workers) directly on the host machine.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - arenalake-net

# -----------------------------------------------------------------------------
# Global Networks and Volumes
# -----------------------------------------------------------------------------
networks:
  arenalake-net:
    driver: bridge                            # Isolated network for all ArenaLake services

volumes:
  minio_data:                                 # Persistent storage for the Data Lake