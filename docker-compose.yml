# -----------------------------------------------------------------------------
# ArenaLake MVP Configuration - Core Infrastructure (Swarm Ready)
# -----------------------------------------------------------------------------
services:

  traefik:
    image: traefik:v2.11
    environment:
      - DOCKER_API_VERSION=1.41
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--providers.docker.swarmMode=true"
    ports:
      - "8088:80"                  # <--- O Traefik escuta na porta 8088 do host
      - "${TRAEFIK_DASH_PORT:-8089}:8080" # <--- Dashboard na 8089 para evitar conflito
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - arenalake-net
    deploy:
      placement:
        constraints:
          - node.role == manager

  spark-master:
    image: bitnamilegacy/spark:3.5
    environment:
      - SPARK_MODE=master
    ports:
      - "${SPARK_UI_PORT:-8080}:8080"
      - "${SPARK_RPC_PORT:-7077}:7077"
    volumes:
      - ${DATALAKE_STORAGE_PATH}/spark_jobs:/jobs
    networks:
      - arenalake-net
    deploy:
      placement:
        constraints:
          - node.role == manager

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${DATALAKE_STORAGE_PATH}/minio_data:/data
    networks:
      - arenalake-net
    deploy:
      placement:
        constraints:
          - node.role == manager

  workspace-builder:
    build:
      context: .
      dockerfile: docker/Dockerfile.workspace
    image: arenalake-workspace:latest
    command: echo "Imagem arenalake-workspace construída com sucesso!"
    deploy:
      placement:
        constraints:
          - node.role == manager

  portal:
    image: arenalake-prod-portal:latest
    build: 
      context: ./portal-compute
      dockerfile: Dockerfile
    env_file:
       - .env
    environment:
      - HOST_PROJECT_PATH=${PWD}
      - WORKSPACE_NETWORK=${WORKSPACE_NETWORK}
    ports:
      - "${PORTAL_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATALAKE_STORAGE_PATH}/projects_data:/app/projects_data
      - ${DATALAKE_STORAGE_PATH}/database:/mnt/datalake/prod/database
    networks:
      - arenalake-net
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portal.rule=PathPrefix(`/`)"
        - "traefik.http.routers.portal.entrypoints=web"
        - "traefik.http.services.portal.loadbalancer.server.port=8000"
        - "traefik.docker.network=arenalake-prod_arenalake-net"

networks:
  arenalake-net:
    driver: overlay
    attachable: true

volumes:
  minio_data: