# -----------------------------------------------------------------------------
# ArenaLake MVP Configuration - Core Infrastructure (Swarm Mode)
# -----------------------------------------------------------------------------
services:

  # 1. GATEWAY / ROUTER (Traefik)
  traefik:
    image: traefik:v2.11
    environment:
      - DOCKER_API_VERSION=1.41
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.swarmmode=true"           # Habilita a leitura de serviços do Swarm
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_WEB_PORT:-80}:80"
      - "${TRAEFIK_DASH_PORT:-8088}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - arenalake-net
    deploy:
      placement:
        constraints:
          - node.role == manager                      # Fixa o Traefik no Lenovo

  # 2. PROCESSING BRAIN (Spark Master)
  spark-master:
    image: bitnamilegacy/spark:3.5
    environment:
      - SPARK_MODE=master
    ports:
      - "${SPARK_UI_PORT:-8080}:8080"
      - "${SPARK_RPC_PORT:-7077}:7077"
    volumes:
      - /opt/arenalake-homolog/spark_jobs:/jobs       # Caminho absoluto para o NFS
    networks:
      - arenalake-net
    deploy:
      placement:
        constraints:
          - node.role == manager                      # Fixa o Master no Lenovo

  # 3. DATA LAKE (MinIO)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - /opt/arenalake-homolog/minio_data:/data       # Caminho absoluto para evitar erros de volume
    networks:
      - arenalake-net
    deploy:
      placement:
        constraints:
          - node.role == manager                      # Fixa o Data Lake no Lenovo

  # 4. WORKSPACE BASE IMAGE BUILDER
  workspace-builder:
    build:
      context: .
      dockerfile: docker/Dockerfile.workspace
    image: arenalake-workspace:latest
    command: echo "Imagem arenalake-workspace construída com sucesso!"
    # Nota: O Swarm ignora o build. As imagens devem ser compiladas antes do deploy da stack.

  # 5. OPERATION ORCHESTRATOR (FastAPI Backend Portal)
  portal:
    build: 
      context: ./portal-compute
      dockerfile: Dockerfile
    image: arenalake-portal:latest                    # Nome da imagem necessário para o Swarm
    env_file:
       - .env
    environment:
      - HOST_PROJECT_PATH=/mnt/arenalake-homolog      # Atualizado para o caminho do disco compartilhado (NFS)
      - WORKSPACE_NETWORK=${WORKSPACE_NETWORK}
    ports:
      - "${PORTAL_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/arenalake-homolog/projects_data:/app/projects_data
    networks:
      - arenalake-net
    deploy:
      placement:
        constraints:
          - node.role == manager                      # Fixa o Portal no Lenovo
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portal.rule=PathPrefix(`/`)"
        - "traefik.http.routers.portal.entrypoints=web"
        - "traefik.http.services.portal.loadbalancer.server.port=8000"

# -----------------------------------------------------------------------------
# Global Networks and Volumes
# -----------------------------------------------------------------------------
networks:
  arenalake-net:
    driver: overlay                                   # Permite comunicação entre computadores diferentes
    attachable: true                                  # Crucial: permite que os workspaces efêmeros se conectem depois

volumes:
  minio_data: